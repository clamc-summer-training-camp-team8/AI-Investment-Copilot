      description: '人工处置状态建议。这是唯一能改状态的接口（FR-S-003）。


        先过可见性，再校验只有负责人能改状态：填了原因不等于有权改别人的卡片。'
      operationId: decide_status_api_theses__thesis_id__status_post
      parameters:
      - in: path
        name: thesis_id
        required: true
        schema:
          title: Thesis Id
          type: string
      - in: header
        name: Authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      - in: header
        name: X-User-Id
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-User-Id
      - in: header
        name: X-User-Teams
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-User-Teams
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusDecisionIn'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThesisOut'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Decide Status
      tags:
      - thesis
