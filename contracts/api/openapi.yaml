          title: Category
          type: string
        company:
          title: Company
          type: string
        decided_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Decided At
        decided_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Decided By
        decided_direction:
          anyOf:
          - type: string
          - type: 'null'
          title: Decided Direction
        decided_hypothesis:
          anyOf:
          - type: string
          - type: 'null'
          title: Decided Hypothesis
        decision_reason:
