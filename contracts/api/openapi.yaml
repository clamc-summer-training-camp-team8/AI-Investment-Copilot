    HypothesisTrendOut:
      description: '假设趋势。


        口径字段是必填而非可选：FR-V-001 要求同时展示口径、报告期与来源，

        字段可选会让前端拿不到时静默不显示，那条要求就落空了。


        `direction` 取「上升/下降/持平/信息不足」，不是预测。FR-V-002 明确不用

        复杂预测模型，只给方向、斜率与连续性。'
