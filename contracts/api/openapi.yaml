  description: 主动权益投资逻辑智能协作平台。系统输出候选信号与状态建议，不产生任何交易、评级或调仓指令。
  title: AI Investment Copilot
  version: 0.1.0
openapi: 3.1.0
paths:
  /api/agent/theses/{thesis_id}/hypotheses/{hypothesis_id}/metric-explanations:
    post:
      operationId: explain_metric_api_agent_theses__thesis_id__hypotheses__hypothesis_id__metric_explanations_post
      parameters:
      - in: path
        name: thesis_id
        required: true
        schema:
          title: Thesis Id
          type: string
      - in: path
        name: hypothesis_id
        required: true
        schema:
          title: Hypothesis Id
          type: string
      - in: header
        name: Authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      - in: header
        name: X-User-Id
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-User-Id
      - in: header
        name: X-User-Teams
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-User-Teams
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentCandidateOut'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Explain Metric
      tags:
      - agent
  /api/agent/theses/{thesis_id}/hypotheses/{hypothesis_id}/metric-recommendations:
    post:
      operationId: recommend_metrics_api_agent_theses__thesis_id__hypotheses__hypothesis_id__metric_recommendations_post
      parameters:
      - in: path
        name: thesis_id
        required: true
        schema:
          title: Thesis Id
          type: string
      - in: path
        name: hypothesis_id
        required: true
        schema:
          title: Hypothesis Id
          type: string
      - in: header
        name: Authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      - in: header
        name: X-User-Id
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
