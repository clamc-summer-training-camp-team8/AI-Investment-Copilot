          title: Category
          type: string
        company:
          title: Company
          type: string
        decided_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Decided At
        decided_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Decided By
        decided_direction:
          anyOf:
          - type: string
          - type: 'null'
          title: Decided Direction
        decided_hypothesis:
          anyOf:
          - type: string
          - type: 'null'
          title: Decided Hypothesis
        decision_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Decision Reason
        disagreement:
          title: Disagreement
          type: string
        event_id:
          title: Event Id
          type: string
        resolved:
          default: false
          title: Resolved
          type: boolean
        title:
          title: Title
          type: string
      required:
      - event_id
      - company
      - title
      - category
      - annotator_a_hypothesis
      - annotator_a_direction
      - annotator_b_hypothesis
      - annotator_b_direction
      - disagreement
      title: AdjudicationOut
      type: object
