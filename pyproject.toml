[project]
name = "ai-investment-copilot"
version = "0.1.0"
description = "主动权益投资逻辑智能协作平台"
requires-python = ">=3.13"

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["."]
exclude = [".venv", "alembic/versions", "analytics/notebooks"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
    "TID",  # tidy-imports
    "RUF",
]
ignore = [
    "E501",    # 行长交给 formatter
    "RUF001",  # 中文全角标点在文档字符串里是正常的
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.flake8-tidy-imports]
# 相对 import 会让模块边界变模糊，统一用绝对路径
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.mypy]
python_version = "3.13"
files = ["app"]
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = false
exclude = ["alembic/versions"]

# 计算与规则模块要求完整类型标注。
# 理由见 ADR-0002：这里的输出是研究员看到的数值，类型错误会直接变成错误结论。
[[tool.mypy.overrides]]
module = ["app.calc.*", "app.core.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = ["arq.*", "pypdf.*", "docx.*", "openpyxl.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers -ra"
markers = [
    "integration: 需要数据库或外部依赖",
    "contract: 校验实现与 contracts/ 一致",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
