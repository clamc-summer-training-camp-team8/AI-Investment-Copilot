name: copilot-demo

x-app-environment: &app-environment
  ENV: integration
  DEBUG: "false"
  TZ: Asia/Shanghai
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
  REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
  STORAGE_DIR: /app/storage
  OBJECT_STORE_ENDPOINT: http://minio:9000
  OBJECT_STORE_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
  OBJECT_STORE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
  OBJECT_STORE_BUCKET: ${OBJECT_STORE_BUCKET:-copilot-documents}
  OBJECT_STORE_REGION: us-east-1
  OBJECT_STORE_SECURE: "false"
  AUTH_MODE: jwt
  AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?AUTH_JWT_SECRET is required}
  CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
  LLM_PROVIDER: local
  LLM_ENDPOINT: ""
  LLM_API_KEY: ""
  LLM_MODEL_VERSION: local-rule-v1
  GLOBAL_SEARCH_ENABLED: "true"
  KNOWLEDGE_QA_ENABLED: "true"
  KNOWLEDGE_QA_GRAPH_ENABLED: "true"
  RETROSPECTIVE_CENTER_ENABLED: "true"
  RETROSPECTIVE_AI_DRAFT_ENABLED: "false"
  QUANT_RESEARCH_ENABLED: "true"
  QUANT_DEMO_ENABLED: "true"
  QUANT_DEFAULT_MARKET_MANIFEST: /app/real_data/quant/akshare-qfq-tuaremax10000-p2a30-20260902-v4/manifest.json
  NO_PROXY: localhost,127.0.0.1,postgres,redis,minio,api,web
  no_proxy: localhost,127.0.0.1,postgres,redis,minio,api,web

x-app-service: &app-service
  image: ${APP_IMAGE:?APP_IMAGE is required}
  environment: *app-environment
  restart: unless-stopped
  networks:
    - edge
    - data

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg16-bookworm
    environment:
      POSTGRES_USER: copilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: copilot_demo
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
      TZ: Asia/Shanghai
    command: ["postgres", "-c", "wal_level=replica", "-c", "max_connections=100"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copilot -d copilot_demo"]
      interval: 5s
      timeout: 5s
      retries: 24
    restart: unless-stopped
    networks:
      - data

  redis:
    image: redis:7.4-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: ["/bin/sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 24
    restart: unless-stopped
    networks:
      - data

  minio:
    image: quay.io/minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 24
    restart: unless-stopped
    networks:
      - data

  migrate:
    <<: *app-service
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    volumes:
      - app-storage:/app/storage

  object-store-bootstrap:
    <<: *app-service
    command:
      - python
      - -c
      - from app.core.config import settings; from app.services.object_store import S3ObjectStore; S3ObjectStore(settings).ensure_bucket()
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    volumes:
      - app-storage:/app/storage

  worker:
    <<: *app-service
    command: ["python", "-m", "arq", "app.workers.settings.WorkerSettings"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      object-store-bootstrap:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - app-storage:/app/storage

  api:
    <<: *app-service
    command: ["python", "-m", "uvicorn", "app.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "*"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      object-store-bootstrap:
        condition: service_completed_successfully
      worker:
        condition: service_started
    volumes:
      - app-storage:/app/storage
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 18
    networks:
      edge:
        aliases:
          - demo-api
      data:

  web:
    image: ${WEB_IMAGE:?WEB_IMAGE is required}
    restart: unless-stopped
    networks:
      edge:
        aliases:
          - demo-web
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 12

networks:
  # Only the HTTP-facing API/web services join the existing ingress network.
  # PostgreSQL, Redis, and MinIO remain on this project's private data network.
  edge:
    external: true
    name: copilot-integration_app
  data:
    internal: true

volumes:
  postgres-data:
  redis-data:
  minio-data:
  app-storage:
