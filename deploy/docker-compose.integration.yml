name: copilot-integration

x-app-environment: &app-environment
  ENV: integration
  DEBUG: "false"
  TZ: Asia/Shanghai
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
  REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
  STORAGE_DIR: /app/storage
  OBJECT_STORE_ENDPOINT: http://minio:9000
  OBJECT_STORE_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
  OBJECT_STORE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
  OBJECT_STORE_BUCKET: ${OBJECT_STORE_BUCKET:-copilot-documents}
  OBJECT_STORE_REGION: us-east-1
  OBJECT_STORE_SECURE: "false"
  AUTH_MODE: jwt
  AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?AUTH_JWT_SECRET is required}
  CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
  LLM_PROVIDER: ${LLM_PROVIDER:-local}
  LLM_ENDPOINT: ${LLM_ENDPOINT:-}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_MODEL_VERSION: ${LLM_MODEL_VERSION:-local-rule-v1}
  RAG_GRAPH_ENABLED: "true"
  RAG_GRAPH_ASSIST_ONLY: "false"
  QUANT_DEFAULT_MARKET_MANIFEST: ${QUANT_DEFAULT_MARKET_MANIFEST:-/app/real_data/quant/akshare-qfq-tushare120-20260830-v1/manifest.json}
  NO_PROXY: localhost,127.0.0.1,postgres,redis,minio,api,web,gateway
  no_proxy: localhost,127.0.0.1,postgres,redis,minio,api,web,gateway

x-app-service: &app-service
  image: ${APP_IMAGE:?APP_IMAGE is required}
  build:
    context: ..
    dockerfile: deploy/integration/Dockerfile.app
  environment: *app-environment
  restart: unless-stopped
  networks:
    - app
    - data

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg16-bookworm
    environment:
      POSTGRES_USER: copilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: copilot
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
      TZ: Asia/Shanghai
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_connections=150
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copilot -d copilot"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks:
      - data

  redis:
    image: redis:7.4-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: ["/bin/sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks:
      - data

  minio:
    image: quay.io/minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks:
      - data

  migrate:
    <<: *app-service
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    volumes:
      - app-storage:/app/storage

  object-store-bootstrap:
    <<: *app-service
    command:
      - python
      - -c
      - from app.core.config import settings; from app.services.object_store import S3ObjectStore; S3ObjectStore(settings).ensure_bucket()
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    volumes:
      - app-storage:/app/storage

  worker:
    <<: *app-service
    command: ["python", "-m", "arq", "app.workers.settings.WorkerSettings"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      object-store-bootstrap:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - app-storage:/app/storage

  api:
    <<: *app-service
    command: ["python", "-m", "uvicorn", "app.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "*"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      object-store-bootstrap:
        condition: service_completed_successfully
      worker:
        condition: service_started
    volumes:
      - app-storage:/app/storage
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    image: ${WEB_IMAGE:?WEB_IMAGE is required}
    build:
      context: ..
      dockerfile: deploy/integration/Dockerfile.web
    restart: unless-stopped
    networks:
      - app

  gateway:
    image: caddy:2.10-alpine
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
      INTEGRATION_SITE_ADDRESS: ${INTEGRATION_SITE_ADDRESS:?INTEGRATION_SITE_ADDRESS is required}
      INTEGRATION_TLS_ARGUMENT: ${INTEGRATION_TLS_ARGUMENT:?INTEGRATION_TLS_ARGUMENT is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
      - "127.0.0.1:8080:8080"
    volumes:
      - ./integration/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 15s
      timeout: 5s
      retries: 8
    restart: unless-stopped
    networks:
      - app

networks:
  app:
  data:
    internal: true

volumes:
  postgres-data:
  redis-data:
  minio-data:
  app-storage:
  caddy-data:
  caddy-config:
