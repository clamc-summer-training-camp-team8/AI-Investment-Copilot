# 本地开发依赖。仅供 local 环境，不用于试点或生产（PRD 12.2 要求环境隔离）。
# 起环境：docker compose -f deploy/docker-compose.local.yml up -d
#
# 端口映射到 127.0.0.1，避免开发机把数据库暴露到局域网。

name: copilot-local

services:
  postgres-wal-init:
    image: pgvector/pgvector:0.8.6-pg16-bookworm
    user: root
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown -R 999:999 /var/lib/postgresql/wal-archive"]
    volumes:
      - postgres-wal:/var/lib/postgresql/wal-archive
    restart: "no"

  postgres:
    # 固定 pgvector 与 PostgreSQL 大版本；P1 混合召回迁移需要 vector 扩展。
    image: pgvector/pgvector:0.8.6-pg16-bookworm
    container_name: copilot-postgres
    environment:
      POSTGRES_USER: copilot
      POSTGRES_PASSWORD: copilot
      POSTGRES_DB: copilot
      # 中文内容排序与比较依赖，建库时固定，避免不同开发机行为不一致
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      TZ: Asia/Shanghai
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_timeout=60s
      - -c
      - archive_command=test ! -f /var/lib/postgresql/wal-archive/%f && cp %p /var/lib/postgresql/wal-archive/%f
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - postgres-wal:/var/lib/postgresql/wal-archive
    depends_on:
      postgres-wal-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copilot -d copilot"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: copilot-redis
    # arq 的任务队列。appendonly 保证重启后未消费任务不丢。
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio:RELEASE.2025-07-23T15-54-02Z
    container_name: copilot-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: copilot
      MINIO_ROOT_PASSWORD: copilot-local-only
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
  minio-data:
  postgres-wal:
